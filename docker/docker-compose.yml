services:
  nginx:
    image: nginx:stable
    container_name: nginx-notification-center
    ports:
      - "80:80"
    volumes:
      - ../app:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
      - phpmyadmin

  php:
    container_name: php-notification-center
    build:
      context: ./php
    volumes:
      - ../app:/var/www/html
    working_dir: /var/www/html
    environment:
      COMPOSER_ALLOW_SUPERUSER: 1

  mysql:
    image: mysql:8
    platform: linux/arm64
    container_name: mysql-notification-center
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_center
      MYSQL_USER: erikas
      MYSQL_PASSWORD: erikas
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: phpmyadmin-notification-center
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    expose:
      - 80

volumes:
  mysql-data:
